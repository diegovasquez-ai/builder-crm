# Barridos de recuperacion cada 30 minutos.
#
# Por que no van en vercel.json: el plan Hobby de Vercel solo admite crons UNA VEZ POR
# DIA, y una expresion mas frecuente hace fallar el deploy. Los crons de vercel.json
# quedan como respaldo diario; el ritmo real lo marca este workflow.
#
# Por que 30 y no 10 minutos: Actions factura por MINUTO REDONDEADO HACIA ARRIBA por
# job, aunque el curl tarde 10 segundos. En un repo privado del plan Free hay 2.000
# minutos gratis al mes:
#   cada 10 min = 4.320 ejecuciones = 4.320 min -> USD 18,56/mes de exceso
#   cada 30 min = 1.440 ejecuciones = 1.440 min -> USD 0
# Esto es una red de seguridad, no el camino normal: un mensaje entrante se contesta
# en ~7s por el webhook. Media hora de ventana de recuperacion sobre un fallo raro no
# cambia nada, y ahorra mas que todo el resto de la infraestructura junta.
#
# Que barren:
#  - /api/agent/process  -> jobs del agente que quedaron pendientes (el setTimeout del
#    webhook murio antes de disparar el worker).
#  - /api/webhooks/zernio -> eventos de Zernio claimeados pero sin procesar. El reintento
#    de Zernio se auto-deduplica, asi que sin este barrido esos eventos se pierden.
#
# Configurar en el repo: Settings -> Secrets and variables -> Actions
#   APP_BASE_URL        (ej https://crm.cliente.com)
#   AGENT_WORKER_SECRET (el mismo valor que en Vercel)

name: Sweepers

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Barrer jobs del agente
        run: |
          curl -sS -m 60 -o /dev/null -w "agent/process -> %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.AGENT_WORKER_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/agent/process"

      - name: Barrer eventos de webhook sin procesar
        run: |
          curl -sS -m 60 -o /dev/null -w "webhooks/zernio -> %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.AGENT_WORKER_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/webhooks/zernio"

      - name: Barrer automatizaciones pendientes
        run: |
          curl -sS -m 60 -o /dev/null -w "automations/process -> %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.AGENT_WORKER_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/automations/process"
