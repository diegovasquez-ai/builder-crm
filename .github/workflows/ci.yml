# CI de Builder CRM: tests + typecheck + lint + build, con modulos apagados y con la
# plantilla inmobiliaria activa (los dos extremos que un cliente puede desplegar).
#
# No necesita credenciales, y la falta de DATABASE_URL es a proposito: el build no debe
# necesitar la base (en el Dockerfile solo las NEXT_PUBLIC_* son build args). Si alguien
# consulta la base al importar un modulo, este workflow lo detecta. Las NEXT_PUBLIC_*
# van con valores de relleno porque Next las hornea en el bundle.

name: CI

on:
  push:
    branches: [main, builder-crm]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulos: ["[]", '["propiedades", "visitas"]']
    name: modulos ${{ matrix.modulos }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-de-relleno
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Activar modulos de la matriz
        run: |
          printf '{ "activos": %s }\n' '${{ matrix.modulos }}' > config/modulos.json
          cat config/modulos.json
      - run: npm run test
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
